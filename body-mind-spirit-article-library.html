<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LifeOS 主題文章智庫｜每一則發文的主題地圖</title>
  <style>
    :root{--ink:#17231d;--paper:#f5f2e9;--white:#fffef9;--orange:#ff5d2d;--green:#163c2e;--line:rgba(23,35,29,.15);--muted:#727870}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{height:68px;padding:0 clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--white);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:11px;font-size:14px;font-weight:700}.mark{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;background:var(--orange);color:#fff}.top span:last-child{font-size:10px;letter-spacing:.14em;color:var(--muted)}.hero{padding:85px clamp(24px,8vw,120px) 75px;background:var(--green);color:#fff;position:relative;overflow:hidden}.hero:after{content:"TOPIC";position:absolute;right:-40px;bottom:-35px;font:900 150px/1 Arial;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.08)}.kicker{font-size:10px;letter-spacing:.22em;color:#ffb29b;font-weight:800}.hero h1{font-size:clamp(42px,6vw,82px);letter-spacing:-.055em;line-height:1.03;margin:18px 0}.hero h1 em{font-style:normal;color:#ff8b68}.hero p{max-width:690px;line-height:1.8;opacity:.65}.search{position:relative;z-index:2;max-width:780px;height:64px;margin-top:28px;background:#fff;display:flex;align-items:center;color:var(--ink);padding:0 18px}.search input{border:0;outline:0;flex:1;font-size:14px}.search b{font-size:11px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);max-width:1050px;margin:-23px auto 0;position:relative;z-index:3;background:var(--white);border:1px solid var(--line)}.summary div{padding:22px 27px;border-right:1px solid var(--line)}.summary div:last-child{border:0}.summary b{font:27px Georgia;margin-right:8px}.summary span{font-size:11px;color:var(--muted)}.app{max-width:1500px;margin:auto;padding:75px clamp(20px,5vw,75px) 110px;display:grid;grid-template-columns:245px 1fr;gap:45px}.sidebar{position:sticky;top:90px;align-self:start}.sidebar h2{font-size:12px;letter-spacing:.15em;margin:0 0 14px}.topics{display:flex;flex-direction:column}.topics button{border:0;border-top:1px solid var(--line);background:transparent;padding:12px 3px;display:flex;justify-content:space-between;text-align:left;font-size:12px}.topics button.active{color:var(--orange);font-weight:700}.topics small{color:var(--muted)}.contentHead{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px}.contentHead h2{font-size:clamp(30px,4vw,52px);letter-spacing:-.05em;margin:8px 0}.contentHead p{font-size:12px;color:var(--muted)}.contentHead select{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:10px}.featured{margin:28px 0;display:grid;grid-template-columns:1.25fr .75fr;background:var(--green);color:#fff;min-height:285px}.featuredMain{padding:38px}.topicLabel{font-size:9px;letter-spacing:.15em;color:var(--orange);font-weight:800}.featured h3{font-size:clamp(28px,3.6vw,48px);line-height:1.16;letter-spacing:-.04em;margin:18px 0}.featured p{font-size:12px;line-height:1.7;opacity:.65}.featuredSide{border-left:1px solid rgba(255,255,255,.15);padding:30px;display:flex;flex-direction:column;justify-content:space-between}.featuredSide b{font:68px Georgia;color:#ff8b68}.featured button{align-self:start;border:0;background:#fff;color:var(--green);padding:11px 15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.post{background:var(--white);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;min-height:285px}.postTop{display:flex;justify-content:space-between;gap:15px}.date{font-size:9px;color:var(--muted)}.post h3{font-size:21px;line-height:1.42;margin:19px 0 11px}.excerpt{font-size:12px;line-height:1.7;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.products{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:18px}.products span{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:5px 7px}.post button{margin-top:16px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:13px 0 0;text-align:left;font-size:11px;font-weight:700}.more{display:block;margin:28px auto 0;border:0;background:var(--green);color:#fff;padding:13px 20px}.modalWrap{display:none;position:fixed;inset:0;z-index:30;background:rgba(4,18,13,.82);padding:20px;place-items:center}.modalWrap.open{display:grid}.modal{width:min(900px,100%);height:min(900px,94vh);overflow:auto;background:var(--white);position:relative}.close{position:sticky;float:right;top:16px;right:16px;width:42px;height:42px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:22px}.modalHead{padding:60px 60px 35px;background:#f0ece0}.modalHead h2{font-size:clamp(34px,5vw,58px);line-height:1.15;letter-spacing:-.05em;margin:18px 0}.meta{font-size:11px;color:var(--muted)}.modalBody{padding:42px 60px 70px}.related{padding-bottom:24px;border-bottom:1px solid var(--line)}.related span{display:inline-block;margin:5px 5px 0 0;padding:7px 9px;border-radius:999px;background:#edf0e8;font-size:10px}.original{white-space:pre-wrap;word-break:break-word;font:14px/1.9 inherit;margin-top:30px}.notice{margin-top:35px;background:#fff0cc;border-left:3px solid #d28d00;padding:15px;font-size:11px;line-height:1.7}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:static}.topics{flex-direction:row;overflow:auto}.topics button{min-width:max-content;border:1px solid var(--line);padding:9px 12px}.featured{grid-template-columns:1fr}.featuredSide{display:none}}@media(max-width:600px){.hero{padding-top:58px}.hero h1{font-size:46px}.summary{margin:-15px 15px 0;grid-template-columns:1fr}.summary div{border-right:0;border-bottom:1px solid var(--line)}.contentHead{display:block}.grid{grid-template-columns:1fr}.modalWrap{padding:0}.modal{height:100vh;max-height:none}.modalHead,.modalBody{padding-left:24px;padding-right:24px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><span class="mark">T</span>LifeOS 主題文章智庫</div><span>POSTS × TOPICS × PRODUCTS</span></header>
  <section class="hero"><div class="kicker">EVERY POST HAS A TOPIC</div><h1>每一則發文，<br>都有它的<em>主題位置。</em></h1><p>把 LINE 原始內容去重、分類並連回相關產品。從疾病機制、身體系統、情緒照護到團購公告，用主題快速找到真正需要的文章。</p><label class="search"><input id="search" placeholder="搜尋文章主題、內文、產品或日期…"><b id="count"></b></label></section>
  <section class="summary"><div><b id="postTotal">—</b><span>則去重發文</span></div><div><b id="topicTotal">—</b><span>個文章主題</span></div><div><b>99</b><span>項關聯產品</span></div></section>
  <main class="app"><aside class="sidebar"><h2>文章主題</h2><div class="topics" id="topics"></div></aside><section><div class="contentHead"><div><div class="kicker" style="color:#a54a2e">TOPIC ARCHIVE</div><h2 id="activeTitle">全部發文</h2><p id="activeDesc"></p></div><select id="sort"><option value="new">最新發文優先</option><option value="old">最舊發文優先</option><option value="products">關聯產品最多</option><option value="long">內容最完整</option></select></div><div id="featured"></div><div class="grid" id="grid"></div><button class="more" id="more" onclick="limit+=20;render()">載入更多發文</button></section></main>
  <div class="modalWrap" id="modalWrap"><article class="modal"><button class="close" onclick="closeModal()">×</button><div id="modal"></div></article></div>
  <script src="topics.js"></script>
  <script>
    const data=window.TOPIC_DATA,allPosts=data.posts;let active='全部發文',limit=20;const norm=s=>(s||'').toLowerCase().replace(/\s/g,'');const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    postTotal.textContent=allPosts.length.toLocaleString();topicTotal.textContent=Object.values(data.topics).filter(Boolean).length;
    function filtered(){const q=norm(search.value);let posts=allPosts.filter(p=>(active==='全部發文'||p.topic===active)&&(!q||norm([p.title,p.text,p.topic,p.date,p.products.map(id=>data.productNames[id]).join(' ')].join(' ')).includes(q)));const mode=sort.value;posts.sort((a,b)=>mode==='old'?a.date.localeCompare(b.date):mode==='products'?b.products.length-a.products.length:mode==='long'?b.text.length-a.text.length:b.date.localeCompare(a.date));return posts}
    function renderTopics(){const items=[['全部發文',allPosts.length],...Object.entries(data.topics).filter(x=>x[1]).sort((a,b)=>b[1]-a[1])];topics.innerHTML=items.map(([name,n])=>`<button class="${name===active?'active':''}" onclick="active='${name}';limit=20;render()"><span>${name}</span><small>${n}</small></button>`).join('')}
    function chips(p){return p.products.slice(0,5).map(id=>`<span>${id} ${data.productNames[id]}</span>`).join('')}
    function render(){const posts=filtered();count.textContent=posts.length+' 則';activeTitle.textContent=active;activeDesc.textContent=`目前顯示 ${posts.length.toLocaleString()} 則主題發文`;renderTopics();const first=posts[0];featured.innerHTML=first?`<article class="featured"><div class="featuredMain"><div class="topicLabel">${first.topic}</div><h3>${first.title}</h3><p>${esc(first.text.slice(0,180))}…</p><button onclick="openPost('${first.id}')">閱讀完整發文 →</button></div><div class="featuredSide"><b>${first.products.length}</b><span>項關聯產品<br>${first.date||'日期未標示'}</span></div></article>`:'';grid.innerHTML=posts.slice(1,limit).map(p=>`<article class="post"><div class="postTop"><span class="topicLabel">${p.topic}</span><span class="date">${p.date}</span></div><h3>${p.title}</h3><p class="excerpt">${esc(p.text.slice(0,260))}</p><div class="products">${chips(p)}</div><button onclick="openPost('${p.id}')">閱讀完整原文 →</button></article>`).join('');more.style.display=posts.length>limit?'block':'none'}
    function openPost(id){const p=allPosts.find(x=>x.id===id);modalWrap.classList.add('open');document.body.style.overflow='hidden';modal.innerHTML=`<div class="modalHead"><div class="topicLabel">${p.topic}</div><h2>${p.title}</h2><div class="meta">${p.date||'日期未標示'} · ${p.products.length} 項關聯產品</div></div><div class="modalBody"><div class="related"><b>本篇關聯產品</b><br>${p.products.map(id=>`<span>${id} ${data.productNames[id]}</span>`).join('')}</div><div class="original">${esc(p.text)}</div><div class="notice"><b>閱讀提醒：</b>此為 LINE 來源歸檔，可能包含個人經驗、轉貼、未驗證機轉或療效說法，不代表已證實或可作為醫療建議。</div></div>`}
    function closeModal(){modalWrap.classList.remove('open');document.body.style.overflow=''}search.addEventListener('input',()=>{limit=20;render()});sort.addEventListener('change',render);modalWrap.addEventListener('click',e=>{if(e.target===modalWrap)closeModal()});render();
  </script>
</body>
</html>
